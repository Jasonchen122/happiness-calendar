<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6D9E1">
<meta name="apple-mobile-web-app-title" content="盈欣牧區">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>盈欣牧區小組平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the real app's phone column — green band with tabs, controls, month grid on top, week-grouped list under it, fixed action bar */
:root{
  --brand:#1F4D3F;--on-brand:#FFFFFF;--hi:#F2C14E;
  --h-mint:#CFEBDD;--h-mint-l:#2F7D5B;--h-pink:#F6D9E1;--h-pink-l:#B04A66;--h-latte:#EFE2CF;--h-latte-l:#8A5A2B;--h-lav:#E0DAF4;--h-lav-l:#5B45A6;--head-ink:#1F3B32;--link:#1F4D3F;--tab-bg:rgba(255,255,255,.7);--tab-line:rgba(31,59,50,.15);--tab-on-ink:#FFFFFF;
  --bg:#F4F5F2;--paper:#FFFFFF;--ink:#1E2A24;--muted:#5E6A63;--faint:#8C968F;--line:#E1E5DF;--soft:#E6EFEA;--danger:#B3412E;--ok:#2F7D5B;--ok-b:#E2F1E9;--warn:#A86A12;--warn-b:#FFF3CF;--scrim:rgba(20,28,24,.45);--demo:#FFF6DB;--demo-ink:#6B4700;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --k0c:#2563A8;--k0b:#E3EEFA;--k1c:#0F766E;--k1b:#DCF2EF;--k2c:#3F7A22;--k2b:#E6F2DD;--k3c:#6A4CB3;--k3b:#ECE6F8;--k4c:#8A5A00;--k4b:#FBEFD3;--k5c:#B03A5B;--k5b:#F9E3EA;--k6c:#B4541A;--k6b:#FBE7DA;--k7c:#7C5A3C;--k7b:#F1E7DD;--k8c:#4B5A6E;--k8b:#E7EBF0;--k9c:#9C2CA8;--k9b:#F5E2F7;--k10c:#0E7490;--k10b:#DBF1F6;--k11c:#5A7A00;--k11b:#EEF4D4;--k12c:#B42318;--k12b:#FBE3E0;--k13c:#3346A8;--k13b:#E3E7FA;
  --g5c:#0E7490;--g5b:#DBF1F6;--g6c:#C2410C;--g6b:#FDE8DC;--g7c:#5A7A00;--g7b:#EEF4D4;
  --g0c:#A8661A;--g0b:#FBF0DE;--g1c:#2F7D5B;--g1b:#E2F1E9;--g2c:#B04A66;--g2b:#F9E5EB;--g3c:#2B6CB0;--g3b:#E2EDF8;--g4c:#6A52AD;--g4b:#ECE7F8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#1D4538;--on-brand:#EEF4F0;--hi:#E5B847;
  --h-mint:#1F3A30;--h-mint-l:#7FD0A8;--h-pink:#3A2530;--h-pink-l:#EE9AB0;--h-latte:#3A3024;--h-latte-l:#E3B985;--h-lav:#2C2740;--h-lav-l:#BBA6EE;--head-ink:#EEF2EF;--link:#7FD0A8;--tab-bg:rgba(0,0,0,.25);--tab-line:rgba(238,242,239,.18);--tab-on-ink:#1A1418;
  --bg:#121714;--paper:#1A211D;--ink:#E7ECE8;--muted:#A3AEA7;--faint:#76817A;--line:#2C3530;--soft:#22302A;--danger:#F0907E;--ok:#7FD0A8;--ok-b:#163126;--warn:#E8C068;--warn-b:#33290F;--scrim:rgba(0,0,0,.6);--demo:#33290F;--demo-ink:#F0D58C;
  --k0c:#8DB8EC;--k0b:#1B2C40;--k1c:#6FD0C4;--k1b:#143230;--k2c:#A3D184;--k2b:#1F3018;--k3c:#BBA6EE;--k3b:#2A2340;--k4c:#E8C068;--k4b:#33290F;--k5c:#EF97AF;--k5b:#3A1D27;--k6c:#F2A879;--k6b:#3A2416;--k7c:#D4AE90;--k7b:#33271D;--k8c:#AEB9C8;--k8b:#252C35;--k9c:#E39CEC;--k9b:#331A3A;--k10c:#7CCBE2;--k10b:#12313A;--k11c:#BCD86C;--k11b:#28300E;--k12c:#F39C92;--k12b:#3A1A17;--k13c:#9EAAF1;--k13b:#1E2340;
  --g5c:#7CCBE2;--g5b:#12313A;--g6c:#F5A57E;--g6b:#3A2216;--g7c:#BCD86C;--g7b:#28300E;
  --g0c:#E8B46F;--g0b:#33260F;--g1c:#7FD0A8;--g1b:#163126;--g2c:#EE9AB0;--g2b:#3A1D27;--g3c:#8DB8EC;--g3b:#1B2C40;--g4c:#BBA6EE;--g4b:#2A2340;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#1D4538;--on-brand:#EEF4F0;--hi:#E5B847;
  --h-mint:#1F3A30;--h-mint-l:#7FD0A8;--h-pink:#3A2530;--h-pink-l:#EE9AB0;--h-latte:#3A3024;--h-latte-l:#E3B985;--h-lav:#2C2740;--h-lav-l:#BBA6EE;--head-ink:#EEF2EF;--link:#7FD0A8;--tab-bg:rgba(0,0,0,.25);--tab-line:rgba(238,242,239,.18);--tab-on-ink:#1A1418;
  --bg:#121714;--paper:#1A211D;--ink:#E7ECE8;--muted:#A3AEA7;--faint:#76817A;--line:#2C3530;--soft:#22302A;--danger:#F0907E;--ok:#7FD0A8;--ok-b:#163126;--warn:#E8C068;--warn-b:#33290F;--scrim:rgba(0,0,0,.6);--demo:#33290F;--demo-ink:#F0D58C;
  --k0c:#8DB8EC;--k0b:#1B2C40;--k1c:#6FD0C4;--k1b:#143230;--k2c:#A3D184;--k2b:#1F3018;--k3c:#BBA6EE;--k3b:#2A2340;--k4c:#E8C068;--k4b:#33290F;--k5c:#EF97AF;--k5b:#3A1D27;--k6c:#F2A879;--k6b:#3A2416;--k7c:#D4AE90;--k7b:#33271D;--k8c:#AEB9C8;--k8b:#252C35;--k9c:#E39CEC;--k9b:#331A3A;--k10c:#7CCBE2;--k10b:#12313A;--k11c:#BCD86C;--k11b:#28300E;--k12c:#F39C92;--k12b:#3A1A17;--k13c:#9EAAF1;--k13b:#1E2340;
  --g5c:#7CCBE2;--g5b:#12313A;--g6c:#F5A57E;--g6b:#3A2216;--g7c:#BCD86C;--g7b:#28300E;
  --g0c:#E8B46F;--g0b:#33260F;--g1c:#7FD0A8;--g1b:#163126;--g2c:#EE9AB0;--g2b:#3A1D27;--g3c:#8DB8EC;--g3b:#1B2C40;--g4c:#BBA6EE;--g4b:#2A2340;
  color-scheme:dark}
.k0{--c:var(--k0c);--b:var(--k0b)}.k1{--c:var(--k1c);--b:var(--k1b)}.k2{--c:var(--k2c);--b:var(--k2b)}.k3{--c:var(--k3c);--b:var(--k3b)}.k4{--c:var(--k4c);--b:var(--k4b)}.k5{--c:var(--k5c);--b:var(--k5b)}.k6{--c:var(--k6c);--b:var(--k6b)}.k7{--c:var(--k7c);--b:var(--k7b)}.k8{--c:var(--k8c);--b:var(--k8b)}.k9{--c:var(--k9c);--b:var(--k9b)}.k10{--c:var(--k10c);--b:var(--k10b)}.k11{--c:var(--k11c);--b:var(--k11b)}.k12{--c:var(--k12c);--b:var(--k12b)}.k13{--c:var(--k13c);--b:var(--k13b)}
.g5{--c:var(--g5c);--b:var(--g5b)}.g6{--c:var(--g6c);--b:var(--g6b)}.g7{--c:var(--g7c);--b:var(--g7b)}
.g0{--c:var(--g0c);--b:var(--g0b)}.g1{--c:var(--g1c);--b:var(--g1b)}.g2{--c:var(--g2c);--b:var(--g2b)}.g3{--c:var(--g3c);--b:var(--g3b)}.g4{--c:var(--g4c);--b:var(--g4b)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--hb);color:var(--head-ink)}
.top.mint{--hb:var(--h-mint);--hl:var(--h-mint-l)}.top.pink{--hb:var(--h-pink);--hl:var(--h-pink-l)}.top.latte{--hb:var(--h-latte);--hl:var(--h-latte-l)}.top.lav{--hb:var(--h-lav);--hl:var(--h-lav-l)}
.ysel{font:inherit;font-weight:700;font-size:1.05rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;min-height:2.6rem;justify-self:center;margin:0 auto}
.macaron{display:flex;gap:6px;margin:6px 0 2px}
.macaron i{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);opacity:.85}
.top .wrap{padding-block:calc(16px + env(safe-area-inset-top,0px)) 14px}
.top small{display:block;font-size:.8rem;letter-spacing:.08em;font-weight:500}
.top h1{margin:2px 0 10px;font-size:1.55rem}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--tab-bg);border:1px solid var(--tab-line);border-radius:14px;padding:4px;margin-top:8px}
.tabs button{border:0;background:none;color:inherit;padding:9px 0;border-radius:10px;font-size:1.05rem}
.tabs button{font-weight:500}
.tabs button[aria-selected="true"]{font-weight:700;background:var(--hl);color:var(--tab-on-ink)}
main{padding-block:14px 120px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.today{border:1.5px solid var(--link);background:var(--paper);color:var(--link);border-radius:10px;padding:5px 12px;font-weight:700}
.nav{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:1.05rem}
.nav button{border:0;background:none;width:2.4rem;height:2.4rem;border-radius:8px;font-size:1.3rem;color:var(--link)}
.nav button:disabled{opacity:.3}
.nav span{min-width:8rem;text-align:center;font-variant-numeric:tabular-nums}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dd-btn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
.dd-btn[aria-expanded="true"]{border-color:var(--brand)}
.sel-chip{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:20px;padding:3px 10px;font-size:.85rem;background:var(--b);color:var(--c);font-weight:500}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--c);flex:0 0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.panel{padding:6px 14px 12px}
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ck input{width:1.2rem;height:1.2rem;accent-color:var(--brand)}
.ck span.n{flex:1}
.ck small{color:var(--muted)}
.panel-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.note{font-size:.85rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}

/* month grid */
.mg{padding:8px 6px 6px}
.row7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{text-align:center;font-size:.75rem;color:var(--faint);padding-bottom:4px}
.wk{border-top:1px solid var(--line);padding:2px 0 6px;min-height:3.2rem}
.dnum{border:0;background:none;text-align:center;font-size:.85rem;padding:2px 0;border-radius:8px;font-variant-numeric:tabular-nums;line-height:1.25;display:flex;flex-direction:column;align-items:center}
.dnum.out{color:var(--faint);opacity:.55}
.dnum.sun{color:var(--danger)}
.dnum.now b{background:var(--hi);color:#1E2A24;border-radius:50%;width:1.6rem;height:1.6rem;display:inline-grid;place-items:center}
.dnum.sel{background:var(--brand);color:var(--on-brand)}
.dnum b{font-weight:500}
.gcount{font-size:.62rem;color:var(--k9c);font-weight:700}
.dnum.sel .gcount{color:var(--on-brand)}
.lane{margin-top:2px}
.bar{border:0;border-radius:6px;background:var(--b);color:var(--c);font-size:.68rem;font-weight:500;line-height:1.25;padding:2px 4px;margin:0 1px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-all;text-align:left;border-left:3px solid var(--c)}
.bar.cont{border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.more{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.dim{opacity:.4}
.big .bar{font-size:0;height:.55rem;padding:0;border-left:0;background:var(--c);margin-top:3px}
.big .wk{min-height:2.6rem}

/* small-group items: outlined in the group's colour */
.bar.gw{background:var(--paper);border:1.5px solid var(--c);color:var(--c);border-left-width:1.5px;font-weight:700}
.big .bar.gw{background:var(--paper);border:2px solid var(--c);height:.55rem}
.more-n{font-size:.68rem;color:var(--muted);text-align:center;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-fill{width:1.4rem;height:.8rem;border-radius:4px;background:var(--k1b);border-left:3px solid var(--k1c)}
.lg-line{width:1.4rem;height:.8rem;border-radius:4px;border:1.5px solid var(--g1c);background:var(--paper)}
.item.gw i{background:var(--c)}
.who{display:inline-block;border:1.5px solid var(--c);color:var(--c);border-radius:20px;padding:0 8px;font-size:.8rem;font-weight:700;margin-right:6px;background:var(--paper)}
.pill.gw{background:var(--paper);border:1.5px solid var(--c);border-left-width:4px}
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0;max-width:22rem}
.daychips button{width:100%;max-width:2.6rem;aspect-ratio:1;justify-self:center;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;line-height:1.1;font-size:.8rem;padding:0}
.daychips button small{font-size:.62rem;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--paper)}
.daychips button[aria-pressed="true"] small{color:var(--paper)}
.fillcard{padding:12px 14px;display:grid;gap:6px}
.fillcard input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:1.05rem}

a.btn{display:block;text-align:center;text-decoration:none}
.linkbox{display:grid;gap:6px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:6px}
.linkbox input{min-height:2.8rem}
.url-err{color:var(--danger);font-size:.85rem}
.addbtn{border:1.5px dashed var(--link);background:var(--paper);color:var(--link);border-radius:10px;padding:5px 12px;font-weight:700}

/* week list */
.wsec{padding:4px 14px 10px}
.wsec+.wsec{border-top:6px solid var(--bg)}
.wsec.past{opacity:.7}
.wh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;gap:8px}
.wh b{font-size:1rem}
.tag{display:inline-block;font-size:.75rem;border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px;font-weight:500}
.tag.now{background:var(--hi);color:#1E2A24}
.tag.open{background:var(--ok-b);color:var(--ok)}
.tag.closed{background:var(--soft);color:var(--muted)}
.tag.ov{background:var(--warn-b);color:var(--warn)}
.tag.ex{background:var(--soft);color:var(--muted)}
.item{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:9px 0;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none}
.item i{border-radius:2px;background:var(--c)}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item b{font-weight:700;min-width:0}
.item .cat{font-size:.78rem;color:var(--c);white-space:nowrap}
.item .r{font-size:.84rem;color:var(--muted)}
.grp{margin-top:6px;background:var(--bg);border-radius:10px;padding:6px 10px}
.grp-h{font-size:.82rem;color:var(--k9c);font-weight:700;padding:2px 0 4px}
.gi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:3px 0 3px 8px;border-left:3px solid var(--c);margin:3px 0;font-size:.9rem}
.gi b{color:var(--c);font-weight:700;white-space:nowrap}
.empty{padding:8px 0;color:var(--faint);font-size:.9rem}
.more-btn{border:1.5px dashed var(--line);background:var(--paper);border-radius:10px;padding:8px;width:100%;color:var(--muted)}

/* week view & year */
.wd{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.wd .dd{text-align:center;line-height:1.2}
.wd .dd b{display:block;font-size:1.3rem}
.wd .dd small{color:var(--muted);font-size:.75rem}
.wd.now{background:var(--warn-b)}
.pills{display:flex;flex-direction:column;gap:6px;align-self:center;min-width:0}
.pill{border:0;text-align:left;background:var(--b);color:var(--c);border-radius:8px;padding:6px 10px;font-size:.92rem;font-weight:500;border-left:4px solid var(--c)}
.pill small{font-weight:400;margin-left:6px}
.yh{font-weight:700;font-size:1.1rem;margin:6px 2px 0}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.ym{padding:10px 12px}
.ym-h{border:0;background:none;padding:0 0 6px;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;width:100%;color:var(--link)}
.ym-h span{color:var(--muted);font-weight:400;font-size:.8rem}
.ym-i{display:grid;grid-template-columns:.6rem 4.8rem minmax(0,1fr);gap:8px;align-items:center;font-size:.88rem;padding:2px 0;border:0;background:none;width:100%;text-align:left}
.ym-i span{color:var(--muted);font-variant-numeric:tabular-nums}

/* signup */
.ev{display:block;width:100%;text-align:left;padding:14px 16px}
.ev h3{margin:0 0 2px;font-size:1.15rem}
.meta{color:var(--muted);font-size:.92rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--brand)}
.sline{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.9rem;color:var(--muted)}
.sline b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat strong{font-size:1.5rem}
.stat.alert strong{color:var(--danger)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.75rem,1fr));gap:8px;margin-top:10px}
.tile{border-radius:10px;padding:6px 10px;border-left:4px solid var(--c);background:var(--b)}
.tile b{display:block;font-weight:500;overflow-wrap:anywhere}
.tile span{font-size:.85rem;font-weight:700;color:var(--c)}
.tile.no{background:var(--paper);border:1.5px dashed var(--line);border-left:4px solid var(--line)}
.tile.no span{color:var(--danger);font-weight:500}
.dash{padding:14px}

<body>
<header class="top pink" id="top"><div class="wrap">
  <div class="hrow"><div><small>行事曆・活動報名・公告</small><h1>盈欣牧區小組平台</h1></div><div id="adminPill"></div></div>
  <div class="macaron" aria-hidden="true"><i class="g0"></i><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i></div>
  <div class="tabs" role="tablist"><button role="tab" id="tCal">行事曆</button><button role="tab" id="tSig">活動報名</button><button role="tab" id="tAnn">公告<span class="tn" id="annN"></span></button></div>
</div></header>
<main class="wrap" id="app"><div class="loading">正在載入…</div></main>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwcvIkeVBoj-OwVBa6kHai4q-_-5tgC_DbYy63IPP4BZt__TTZ6gIyos_J6PIDCTI94/exec';
const VERSION = '1114-2000';
const WEEKLY_CAT = '小組活動';

/* ---------- 日期 ---------- */
const E0 = Date.UTC(2000, 0, 1);
const D = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - E0) / 864e5);
const dt = n => new Date(E0 + n * 864e5);
const yr = n => dt(n).getUTCFullYear(), mo = n => dt(n).getUTCMonth() + 1, da = n => dt(n).getUTCDate(), wd = n => dt(n).getUTCDay();
const W = '日一二三四五六';
const fd = n => `${mo(n)}/${da(n)}`, fw = n => `${fd(n)}（${W[wd(n)]}）`;
const iso = n => dt(n).toISOString().slice(0, 10);
const fromIso = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? D(+m[1], +m[2], +m[3]) : null; };
const miOf = n => (yr(n) - 2000) * 12 + mo(n) - 1;
const mFirst = mi => D(2000 + Math.floor(mi / 12), mi % 12 + 1, 1), mLast = mi => mFirst(mi + 1) - 1;
const mLabel = mi => `${2000 + Math.floor(mi / 12)} 年 ${mi % 12 + 1} 月`;
const weekStart = n => n - wd(n);

/* ---------- 資料 ---------- */
let TODAY = D(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
let CATS = [], GROUPS = [], EV = [], WEEKLY = [], SIG = {}, ANN = [];
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = { loaded: false, tab: 'cal', view: 'month', mi: miOf(TODAY), ws: weekStart(TODAY), year: yr(TODAY), day: null,
  cats: new Set(), ddOpen: false, showPast: false, showPastEv: false, fs: ls.get('fontPx', 16), pw: ls.get('adminPw', ''),
  ret: null, evId: null, newDay: null, afterOpen: false, leader: null, next: null, openG: null, annId: null, newCat: '' };
S.admin = !!S.pw;
let SEEN = new Set(ls.get('annSeen', []));

function ingest(j) {
  TODAY = fromIso(j.today) ?? TODAY;
  CATS = j.cats.map(c => ({ n: c.name, k: ((c.color % 14) + 14) % 14 }));
  if (!CATS.some(c => c.n === WEEKLY_CAT)) CATS.push({ n: WEEKLY_CAT, k: 9 });
  GROUPS = j.groups.map(g => ({ c: g.name, g: 'g' + (((g.color % 8) + 8) % 8), names: g.leaders }));
  const sigOf = id => { const x = j.sig[id]; return x ? { status: x.status, deadline: fromIso(x.deadline), hint: x.hint, photos: x.photos } : null; };
  const calIds = new Set(j.cal.map(e => e.id));
  EV = j.cal.map(e => { const s = fromIso(e.start); return { id: e.id, s, e: Math.max(s, fromIso(e.end) ?? s), n: e.name, cat: e.cat,
    time: e.time, place: e.place, info: e.info, url: e.url, urlText: e.urlText, sig: sigOf(e.id) }; });
  Object.entries(j.sig).forEach(([id, x]) => {
    const s = fromIso(x.date);
    if (!calIds.has(id) && s != null) EV.push({ id, s, e: s, n: x.name, cat: '', time: x.time, place: x.place, info: x.info, url: '', urlText: '', sig: sigOf(id) });
  });
  WEEKLY = j.weekly.map(w => { const sun = fromIso(w.sun), d = fromIso(w.date); return { id: w.id, sun, s: d ?? sun, e: d ?? sun, dated: d != null, n: w.name, leader: w.leader, weekly: true, cat: WEEKLY_CAT }; });
  SIG = j.signups || {};
  ANN = j.ann.map(a => Object.assign({}, a, { start: fromIso(a.start), end: fromIso(a.end) }));
}

/* ---------- 工具 ---------- */
const h = (t, a, ...k) => { const n = document.createElement(t); if (a) for (const x in a) { const v = a[x]; if (v == null || v === false) continue;
  if (x === 'class') n.className = v; else if (x === 'style') n.setAttribute('style', v); else if (x.startsWith('on')) n.addEventListener(x.slice(2), v);
  else n.setAttribute(x, v === true ? (x.startsWith('aria-') ? 'true' : '') : v); }
  k.flat(Infinity).forEach(c => { if (c != null && c !== false) n.append(c instanceof Node ? c : String(c)); }); return n; };
const app = document.getElementById('app');
const setApp = (...k) => app.replaceChildren(...k.flat(Infinity).filter(x => x != null && x !== false));
const leaders = () => GROUPS.flatMap(g => g.names);
const gOf = n => GROUPS.find(g => g.names.includes(n));
const catK = name => (CATS.find(c => c.n === name) || { k: 8 }).k;
const catLabel = name => name || '未分類';
const cls = e => e.weekly ? 'gw ' + ((gOf(e.leader) || { g: 'g1' }).g) : 'k' + catK(e.cat);
const sortEv = a => a.sort((x, y) => x.s - y.s || (y.e - y.s) - (x.e - x.s) || String(x.time || '').localeCompare(String(y.time || '')));
const range = e => (e.s === e.e ? fw(e.s) : `${fw(e.s)} – ${fw(e.e)}・${e.e - e.s + 1} 天`) + (e.time ? ' ' + e.time : '');
const overlaps = e => e.weekly ? [] : EV.filter(o => o !== e && o.s <= e.e && o.e >= e.s);
const visible = () => { const all = EV.concat(WEEKLY); return S.cats.size ? all.filter(e => S.cats.has(e.cat || '未分類')) : all; };
function sigState(e) { if (!e.sig) return null; if (e.s < TODAY) return ['已結束', 'closed']; if (e.sig.status === '關閉') return ['已關閉', 'closed'];
  if (e.sig.deadline != null && TODAY > e.sig.deadline) return ['已截止', 'closed']; return ['報名中', 'open']; }
function sigStats(e) { const s = SIG[e.id] || {}; const ls2 = leaders().filter(n => s[n] && s[n].count); return { s, groups: ls2.length, people: ls2.reduce((t, n) => t + s[n].count, 0) }; }
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function go(o) { Object.assign(S, o); render(); window.scrollTo(0, 0); }
function back() { const r = S.ret || { tab: 'cal' }; S.ret = null; go(r); }
function field(lbl, el) { return [h('label', { for: el.id }, lbl), el]; }
const okUrl = u => /^https?:\/\/\S+\.\S+/.test(u);
const linkBtn = (url, text) => url ? h('a', { class: 'btn ghost', href: url, target: '_blank', rel: 'noopener' }, (text || '開啟連結') + ' ↗') : null;
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製，可以貼到 LINE'); }
  catch (e) { window.prompt('請複製下面的文字', text); }
}

/* ---------- 後台連線 ---------- */
async function api(body) {
  let res;
  try {
    res = body ? await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }) : await fetch(API_URL, { cache: 'no-store' });
  } catch (e) { throw new Error('網路連線不穩，請稍後再試一次。'); }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '發生錯誤，請再試一次');
  ingest(json);
  return json;
}
const adminBody = b => Object.assign({ password: S.pw }, b);
async function run(btn, body, done) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '儲存中…';
  try { const j = await api(body); done(j); }
  catch (e) {
    toast(e.message);
    if (/管理密碼/.test(e.message)) { S.pw = ''; S.admin = false; ls.del('adminPw'); render(); }
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- 照片 ---------- */
function photoUrl(id, w) { return id.startsWith('data:') ? id : `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w || 1600}`; }

  const img = h('img', { src: photoUrl(id, w), alt: '活動照片', loading: 'lazy' });
  img.addEventListener('error', () => { if (!img.dataset.fb && !id.startsWith('data:')) { img.dataset.fb = '1'; img.src = `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w || 1600}`; } });
  return img;
}

  if (!ids || !ids.length) return null;
  return h('div', null, h('div', { class: 'photos' }, ids.map((id, i) => h('button', { class: 'thumb', 'aria-label': `放大第 ${i + 1} 張照片`, onclick: () => lightbox(ids, i) }, photoImg(id, 400)))),
    h('div', { class: 'note', style: 'margin-top:4px' }, '點圖片可以放大'));
}
function lightbox(ids, start) {
  let i = start;
  const img = h('div', { class: 'lb-img' }), count = h('span');
  const box = h('div', { class: 'lightbox', role: 'dialog', 'aria-label': '照片放大檢視' });
